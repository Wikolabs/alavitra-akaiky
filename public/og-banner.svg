<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Image de partage inme.one. Fond bleu profond, la marque, le nom, la
       promesse. Aplats seulement, aucun degrade.
       Le fichier est rendu au navigateur par public/render-assets.mjs, qui
       charge Cormorant Garamond et Inter : les familles nommees ici sont donc
       bien celles du site. -->
  <rect width="1200" height="630" fill="#17315C"/>

  <!-- La marque, mise a l'echelle 4.5 depuis la tuile de 48 -->
  <g transform="translate(96 150) scale(4.5)">
    <rect x="20" y="13" width="19" height="26" fill="#E3B341"/>
    <path d="M23 17 L29 19.18 L29 37.18 L23 35 Z" fill="#FFFFFF" opacity="0.42"/>
    <path d="M9 9 L20 13 L20 39 L9 35 Z" fill="#FFFFFF"/>
    <path d="M20 13 L20 39" stroke="#17315C" stroke-width="1.6"/>
    <circle cx="12.5" cy="23.3" r="1.9" fill="#17315C"/>
  </g>

  <text x="330" y="256" font-family="Cormorant Garamond, Georgia, serif" font-size="108" font-weight="600" fill="#FFFFFF">inme</text>
  <text x="330" y="312" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#E3B341" letter-spacing="3">IN ME, IN YOU</text>
  <text x="330" y="386" font-family="Inter, system-ui, sans-serif" font-size="38" fill="#FFFFFF">Un compagnon qui écoute,</text>
  <text x="330" y="436" font-family="Inter, system-ui, sans-serif" font-size="38" fill="#FFFFFF">une Écriture qui répond.</text>
  <text x="330" y="494" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#A9BBD6">Gratuit, sans compte, en malgache, en français et en anglais.</text>

  <!-- Filet d'or en pied -->
  <rect x="0" y="608" width="1200" height="8" fill="#E3B341"/>
</svg>
